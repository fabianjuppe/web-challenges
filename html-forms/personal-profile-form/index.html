<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <header><h1 id="title">Create your Personal Profile</h1></header>
  <body>
    <form aria-labelledby="title">
      <p id="personal-information-description">
        We want to get to know you! Please enter your personal information.
      </p>
      <fieldset aria-describedby="personal-information-description">
        <legend>Personal Information</legend>

        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" />

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" />

        <label for="your-birthday">First Name:</label>
        <input type="date" id="your-birthday" />
      </fieldset>
      <p id="further-information-description">
        Can you tell us a little bit more? We want to annoy you with unwanted
        ads.
      </p>
      <fieldset aria-describedby="further-information-description">
        <legend>Further Information</legend>

        <label for="favourite-color">Favourite Color:</label>
        <input type="color" id="favourite-color" value="#E5430F" />

        <label for="favourite-pet">What's your favourite pet?</label>
        <select id="favourite-pet">
          <option value="" disabled selected>
            --Please choose an option---
          </option>
          <option value="agra-cadabra">Agra Cadabra</option>
          <option value="chicken-turtle">Chicken Turtle</option>
          <option value="fried-egg-jellyfish">Fried Egg Jellyfish</option>
        </select>
      </fieldset>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
